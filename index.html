<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cycling Logs</title>

<!-- Leaflet.js -->
<!-- Tabler Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* ── リセット・ベース ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:   #1D9E75;
  --green-l: #E1F5EE;
  --green-d: #085041;
  --blue:    #378ADD;
  --blue-l:  #E6F1FB;
  --amber:   #EF9F27;
  --red:     #D85A30;
  --ink:     #1a1a1a;
  --muted:   #6b7280;
  --border:  #e5e7eb;
  --bg:      #f5f7fa;
  --white:   #ffffff;
  --radius:  10px;
  --shadow:  0 2px 8px rgba(0,0,0,.10);
  --font:    'DM Sans', system-ui, sans-serif;
  --sb-w:    280px;
}
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; }

/* ── レイアウト ── */
.app { display: flex; flex-direction: column; height: 100vh; }

/* ── トップバー ── */
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 1000;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--green-d); }
.logo svg { width: 20px; height: 20px; color: var(--green); }
.top-stats { display: flex; gap: 16px; }
.ts { text-align: right; }
.ts-n { font-size: 13px; font-weight: 600; color: var(--ink); }
.ts-l { font-size: 10px; color: var(--muted); }

/* ── メイン（サイドバー＋マップ）── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── サイドバー ── */
.sidebar {
  width: var(--sb-w);
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
.sb-body { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

/* フィルター */
.filter-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
.filter-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 7px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-size: 11px; padding: 3px 8px; border-radius: 20px;
  border: 1px solid var(--border); color: var(--muted);
  cursor: pointer; background: var(--white); transition: all .15s; line-height: 1.6;
}
.tag:hover { border-color: var(--green); color: var(--green-d); }
.tag.on { background: var(--green-l); border-color: var(--green); color: var(--green-d); font-weight: 600; }

/* コース一覧 */
.course-list { display: flex; flex-direction: column; gap: 5px; }
.list-header { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding: 2px 2px; }
.cc {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 10px; cursor: pointer; background: var(--white);
  transition: all .15s;
}
.cc:hover { border-color: var(--green); background: var(--green-l); }
.cc.active { border-color: var(--green); border-width: 2px; background: var(--green-l); }
.cc-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; color: var(--muted); }
.cc-meta span { display: flex; align-items: center; gap: 2px; }
.cc-tags { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
.area-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 8px;
  background: var(--bg); color: var(--muted); border: 1px solid var(--border);
}
.area-tag.sendai  { background: var(--green-l); color: var(--green-d); border-color: #9FE1CB; }
.area-tag.kochi   { background: #FAEEDA; color: #633806; border-color: #EF9F27; }
.area-tag.shimana { background: var(--blue-l);  color: #0C447C; border-color: #85B7EB; }
.area-tag.rinko   { background: #F3EEF8; color: #5B2D8E; border-color: #C4A8E8; }
.src-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 3px; }
.src-rk { background: var(--green); }
.src-br { background: var(--blue); }

.empty-msg { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }
.loading-msg { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

/* ── マップエリア ── */
.map-wrap { flex: 1; position: relative; }
#map { width: 100%; height: 100%; }

/* ── コース詳細パネル ── */
.detail-panel-old {
  position: absolute;
  bottom: 16px; left: 9999px;
  width: 230px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 13px 14px;
  z-index: 500;
  display: none;
}
.detail-panel.show { display: block; }
.dp-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 10px; line-height: 1.4; }
.dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px; }
.dp-stat { background: var(--bg); border-radius: 7px; padding: 6px 8px; }
.dp-stat-n { font-size: 14px; font-weight: 700; color: var(--ink); }
.dp-stat-l { font-size: 9px; color: var(--muted); margin-top: 1px; }
.dp-stat.bryton { background: var(--blue-l); }
.dp-stat.bryton .dp-stat-n { color: #0C447C; }
.elev-wrap { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px; }
.elev-label { font-size: 9px; color: var(--muted); margin-bottom: 3px; }
.elev-svg { width: 100%; height: 44px; }
.dp-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 7px; }
.dp-date { font-size: 9px; color: var(--muted); }
.dp-close { font-size: 11px; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); }
.dp-close:hover { background: var(--bg); }

/* ── マップ上のコントロール ── */
.map-controls {
  position: absolute;
  top: 12px; right: 12px;
  display: flex; flex-direction: column; gap: 6px;
  z-index: 500;
}
.mc-btn {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 12px;
  font-family: var(--font);
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 5px;
  transition: all .15s;
}
.mc-btn:hover { background: var(--green-l); border-color: var(--green); color: var(--green-d); }
.mc-btn.on { background: var(--green-l); border-color: var(--green); color: var(--green-d); font-weight: 600; }

/* ── ローディングオーバーレイ ── */
.map-loading {
  position: absolute; inset: 0;
  background: rgba(255,255,255,.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 600; font-size: 14px; color: var(--muted);
  display: none;
}
.map-loading.show { display: flex; }

/* ── スピナー ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; }

/* ── モバイル対応 ── */
@media (max-width: 700px) {
  :root { --sb-w: 100%; }
  .main { flex-direction: column; }
  .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  .top-stats { display: none; }
  .detail-panel { width: calc(100% - 32px); }
}

/* ── ルート色ピッカー ── */
.color-picker-row { display: flex; align-items: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.color-dot {
  width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: transform .15s, border-color .15s;
  flex-shrink: 0;
}
.color-dot:hover { transform: scale(1.25); }
.color-dot.selected { border-color: var(--ink); transform: scale(1.15); }
.color-label { font-size: 10px; color: var(--muted); }

/* ── 地図スタイル切り替え ── */
.tile-switcher {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.tile-btn {
  padding: 7px 11px;
  font-size: 11px;
  font-family: var(--font);
  color: var(--ink);
  cursor: pointer;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  text-align: left;
  transition: background .12s;
  white-space: nowrap;
}
.tile-btn:last-child { border-bottom: none; }
.tile-btn:hover { background: var(--green-l); color: var(--green-d); }
.tile-btn.on { background: var(--green-l); color: var(--green-d); font-weight: 600; }


/* ── 表示トグルボタン ── */
.cc-header { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
.cc-name { font-size: 12px; font-weight: 600; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vis-btn {
  flex-shrink: 0;
  width: 26px; height: 26px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--white);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all .15s;
  line-height: 1;
  padding: 0;
  color: var(--muted);
}
.vis-btn:hover { border-color: var(--green); background: var(--green-l); color: var(--green-d); }
.vis-btn.visible {
  background: var(--green);
  border-color: var(--green-d);
  color: white;
}
.vis-btn.loading { opacity: .5; pointer-events: none; }
.cc { border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 10px; cursor: pointer; background: var(--white); transition: all .15s; }
.cc:hover { border-color: var(--green); }
.cc.active { border-color: var(--green); border-width: 2px; background: var(--green-l); }
.cc.map-visible { border-left: 3px solid var(--green); }
.route-indicator {
  display: inline-block;
  width: 18px; height: 3px;
  border-radius: 2px;
  vertical-align: middle;
  margin-right: 3px;
}

/* ── 高低図パネル（右下固定・大型）── */
.elev-panel {
  position: absolute;
  bottom: 16px; right: 16px;
  width: 340px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
  z-index: 500;
  display: none;
  overflow: hidden;
}
.elev-panel.show { display: block; }
.elev-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px 8px;
  border-bottom: 1px solid var(--border);
}
.elev-panel-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  max-width: 230px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.elev-panel-close {
  width: 22px; height: 22px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  color: var(--muted);
}
.elev-panel-close:hover { background: var(--bg); }
.elev-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-bottom: 1px solid var(--border);
}
.elev-stat {
  padding: 8px 10px;
  border-right: 1px solid var(--border);
  text-align: center;
}
.elev-stat:last-child { border-right: none; }
.elev-stat-n { font-size: 13px; font-weight: 700; color: var(--ink); }
.elev-stat-l { font-size: 9px; color: var(--muted); margin-top: 1px; }
.elev-stat.br { background: #F0F7FF; }
.elev-stat.br .elev-stat-n { color: #0C447C; }
.elev-chart-wrap {
  padding: 10px 14px 12px;
  background: var(--bg);
}
.elev-axis {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--muted);
  margin-top: 4px;
}
.elev-footer {
  padding: 7px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  background: var(--white);
}
.elev-footer-date { font-size: 10px; color: var(--muted); }
.elev-footer-src {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 600;
}
.src-rk-badge { background: var(--green-l); color: var(--green-d); border: 1px solid #9FE1CB; }
.src-br-badge { background: var(--blue-l);  color: #0C447C; border: 1px solid #85B7EB; }

</style>
</head>
<body>

<div class="app">
  <!-- トップバー -->
  <header class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
        <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V9l-3-3 5 3 2 5"/>
      </svg>
      My Cycling Logs
    </div>
    <div class="top-stats" id="topStats">
      <div class="ts"><div class="ts-n" id="statCount">—</div><div class="ts-l">コース数</div></div>
      <div class="ts"><div class="ts-n" id="statDist">—</div><div class="ts-l">総距離</div></div>
      <div class="ts"><div class="ts-n" id="statElev">—</div><div class="ts-l">総獲得標高</div></div>
    </div>
  </header>

  <div class="main">
    <!-- サイドバー -->
    <aside class="sidebar">
      <div class="sb-body">

        <!-- エリアフィルター -->
        <div class="filter-card">
          <div class="filter-title">エリア</div>
          <div class="tags" id="areaFilter">
            <span class="tag on" data-val="">全て</span>
            <span class="tag" data-val="仙台市内">仙台市内</span>
            <span class="tag" data-val="秋保・定義">秋保・定義</span>
            <span class="tag" data-val="作並">作並</span>
            <span class="tag" data-val="七ツ森">七ツ森</span>
            <span class="tag" data-val="泉・富谷">泉・富谷</span>
            <span class="tag" data-val="高知">高知</span>
            <span class="tag" data-val="しまなみ">しまなみ</span>
            <span class="tag" data-val="輪行先">輪行先</span>
            <span class="tag" data-val="その他">その他</span>
          </div>
        </div>

        <!-- 距離帯フィルター -->
        <div class="filter-card">
          <div class="filter-title">距離帯</div>
          <div class="tags" id="distFilter">
            <span class="tag on" data-min="" data-max="">全て</span>
            <span class="tag" data-min="0"   data-max="20" >〜20km</span>
            <span class="tag" data-min="20"  data-max="50" >20〜50km</span>
            <span class="tag" data-min="50"  data-max="80" >50〜80km</span>
            <span class="tag" data-min="80"  data-max="120">80〜120km</span>
            <span class="tag" data-min="120" data-max=""   >120km〜</span>
          </div>
        </div>

        <!-- コースタイプフィルター -->
        <div class="filter-card">
          <div class="filter-title">コースタイプ</div>
          <div class="tags" id="typeFilter">
            <span class="tag on" data-val="">全て</span>
            <span class="tag" data-val="ヒルクライム">ヒルクライム</span>
            <span class="tag" data-val="山岳">山岳</span>
            <span class="tag" data-val="平坦">平坦</span>
            <span class="tag" data-val="サイクリングロード">サイクリングロード</span>
            <span class="tag" data-val="輪行">輪行</span>
          </div>
        </div>

        <!-- コース一覧 -->
        <div class="list-header" id="listHeader">コース一覧</div>
        <div class="course-list" id="courseList">
          <div class="loading-msg"><span class="spinner" style="display:inline-block;vertical-align:middle;margin-right:6px;"></span>読み込み中...</div>
        </div>

      </div>
    </aside>

    <!-- マップ -->
    <div class="map-wrap">
      <div id="map"></div>

      <!-- マップ上ボタン -->
      <div class="map-controls">
        <button class="mc-btn" id="btnAllRoutes" onclick="toggleAllRoutes()">🗺 全コース表示</button>
        <div class="tile-switcher">
          <button class="tile-btn on" onclick="setTile('voyager',this)">🗺 Voyager</button>
          <button class="tile-btn" onclick="setTile('standard',this)">🗺 標準</button>
          <button class="tile-btn" onclick="setTile('pale',this)">🌫 淡色</button>
          <button class="tile-btn" onclick="setTile('topo',this)">⛰ 地形図</button>
          <button class="tile-btn" onclick="setTile('dark',this)">🌙 ダーク</button>
        </div>
      </div>

      <!-- マップローディング -->
      <div class="map-loading" id="mapLoading">
        <div class="spinner"></div>ルートを読み込み中...
      </div>

      <!-- 高低図パネル（右下固定） -->
      <div class="elev-panel" id="elevPanel">
        <div class="elev-panel-header">
          <div class="elev-panel-title" id="epTitle">—</div>
          <button class="elev-panel-close" onclick="closeDetail()">✕</button>
        </div>
        <div class="elev-stats" id="epStats"></div>
        <div class="elev-chart-wrap">
          <svg id="epChart" width="100%" height="80" viewBox="0 0 312 80" preserveAspectRatio="none"
               style="display:block;border-radius:6px;overflow:hidden;"></svg>
          <div class="elev-axis">
            <span id="epEleMin">—m</span>
            <span style="color:var(--muted);font-size:9px;">標高プロファイル</span>
            <span id="epEleMax">—m</span>
          </div>
        </div>
        <div class="elev-footer">
          <span class="elev-footer-date" id="epDate">—</span>
          <span class="elev-footer-src" id="epSrc">—</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ── 設定 ──────────────────────────────────────────────────
const GAS_URL    = 'https://script.google.com/macros/s/AKfycbyA43JNPVwYKm_3Q78eHK0gOdu2EWvlF3OYYkVS3TsZ-naLLxjDSf8qPJJb8osMdcAr/exec';
const ACCESS_KEY = 'aethos2026';

// 選択可能なルート色パレット
const ROUTE_COLORS = [
  '#E24B4A', // 赤
  '#EF9F27', // オレンジ
  '#F5D800', // 黄
  '#1D9E75', // 緑（デフォルト）
  '#20B2AA', // 青緑
  '#378ADD', // 青
  '#9B59B6', // 紫
  '#E91E8C', // ピンク
  '#FF6B35', // 朱色
  '#2E8B57', // 濃緑
  '#1A237E', // 濃青
  '#795548', // 茶
  '#607D8B', // グレー
  '#000000', // 黒
];

// エリアごとのルート色
const AREA_COLORS = {
  '仙台市内'  : '#1D9E75',
  '秋保・定義': '#2E8B57',
  '作並'      : '#3CB371',
  '七ツ森'    : '#20B2AA',
  '泉・富谷'  : '#66CDAA',
  '高知'      : '#EF9F27',
  'しまなみ'  : '#378ADD',
  '輪行先'    : '#9B59B6',
  'その他'    : '#888888',
};

// ── 状態管理 ──────────────────────────────────────────────
let allCourses    = [];
let courseFilter  = { area: '', dist_min: '', dist_max: '', type: '' };
let routeLayers   = {};   // { courseId: L.polyline }
let activeId      = null;
let showAllRoutes = false;
let gpxCache      = {};   // { courseId: [[lat,lon],...] }
let visibleCourses = new Set(); // 地図に表示中のコースID
let map;

// ── 地図初期化 ────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([38.26, 140.87], 11);
  setTile('voyager', null); // デフォルトタイル
}

// ── タイルレイヤー管理 ────────────────────────────────────
const TILES = {
  voyager: {
    url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    attr: '© <a href="https://carto.com/">CARTO</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  },
  standard: {
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    attr: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  },
  pale: {
    url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    attr: '© <a href="https://carto.com/">CARTO</a> © OpenStreetMap',
  },
  topo: {
    url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    attr: '© <a href="https://opentopomap.org/">OpenTopoMap</a>',
  },
  dark: {
    url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    attr: '© <a href="https://carto.com/">CARTO</a> © OpenStreetMap',
  },
};
let currentTile = null;

function setTile(name, btn) {
  if (currentTile) map.removeLayer(currentTile);
  const t = TILES[name];
  currentTile = L.tileLayer(t.url, { attribution: t.attr, maxZoom: 18 }).addTo(map);
  // ボタンのon状態切り替え
  document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
}

// ── ルート色変更 ──────────────────────────────────────────
async function changeRouteColor(courseId, courseName, color, dotEl) {
  // allCoursesのroute_colorを更新
  const course = allCourses.find(c => c.id == courseId);
  if (course) course.route_color = color;

  // 色ドットのselected状態を更新
  const card = dotEl.closest('.cc');
  card.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  dotEl.classList.add('selected');

  // 表示中のルートを即時更新
  if (routeLayers[courseId]) {
    routeLayers[courseId].setStyle({ color });
  }

  // GASに保存（route_colorはmemoフィールドに埋め込む方式 → update_meta）
  try {
    const url = GAS_URL
      + '?key='    + encodeURIComponent(ACCESS_KEY)
      + '&action=update_meta'
      + '&id='     + encodeURIComponent(courseId)
      + '&route_color=' + encodeURIComponent(color);
    await fetch(url);
  } catch(e) { console.warn('色の保存に失敗:', e); }
}

// ── コース一覧取得 ────────────────────────────────────────
async function loadCourses() {
  try {
    const url = `${GAS_URL}?key=${encodeURIComponent(ACCESS_KEY)}&action=list`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.status !== 'ok') return;
    allCourses = data.courses;
    updateStats();
    renderList();
  } catch(e) {
    document.getElementById('courseList').innerHTML =
      '<div class="empty-msg">読み込みエラー</div>';
  }
}

// ── 統計更新 ──────────────────────────────────────────────
function updateStats() {
  const courses = getFilteredCourses();
  const totalDist = courses.reduce((s,c) => s + (parseFloat(c.distance_km)||0), 0);
  const totalElev = courses.reduce((s,c) => s + (parseFloat(c.elevation_m)||0), 0);
  document.getElementById('statCount').textContent = courses.length + ' コース';
  document.getElementById('statDist').textContent  = totalDist.toFixed(0) + ' km';
  document.getElementById('statElev').textContent  = totalElev.toFixed(0) + ' m';
}

// ── フィルター後のコース ──────────────────────────────────
function getFilteredCourses() {
  return allCourses.filter(c => {
    const d = parseFloat(c.distance_km) || 0;
    if (courseFilter.area && c.area !== courseFilter.area) return false;
    if (courseFilter.type && c.course_type !== courseFilter.type) return false;
    if (courseFilter.dist_min !== '' && d < parseFloat(courseFilter.dist_min)) return false;
    if (courseFilter.dist_max !== '' && d >= parseFloat(courseFilter.dist_max)) return false;
    return true;
  });
}

// ── コース一覧レンダリング ────────────────────────────────
function renderList() {
  const courses = getFilteredCourses();
  const list    = document.getElementById('courseList');
  document.getElementById('listHeader').textContent =
    `コース一覧（${courses.length}件）`;
  updateStats();

  if (courses.length === 0) {
    list.innerHTML = '<div class="empty-msg">該当するコースがありません</div>';
    return;
  }

  list.innerHTML = courses.map(c => {
    const color   = AREA_COLORS[c.area] || '#888';
    const areaKey = getAreaKey(c.area);
    const src     = c.data_source || '';
    const srcDot  = src.includes('bryton')
      ? `<span class="src-dot src-br"></span>`
      : `<span class="src-dot src-rk"></span>`;
    const routeColor = c.route_color || AREA_COLORS[c.area] || '#1D9E75';
    const colorDots  = ROUTE_COLORS.map(col =>
      `<span class="color-dot ${col === routeColor ? 'selected' : ''}"
        style="background:${col};"
        onclick="event.stopPropagation();changeRouteColor('${c.id}','${esc(c.name)}','${col}',this)"
        title="${col}"></span>`
    ).join('');
    const isVisible = visibleCourses.has(c.id);
    const visIcon   = isVisible ? '👁' : '👁';
    const indicatorStyle = isVisible
      ? `<span class="route-indicator" style="background:${routeColor};"></span>` : '';
    return `
    <div class="cc ${activeId === c.id ? 'active' : ''} ${isVisible ? 'map-visible' : ''}"
         onclick="selectCourse('${c.id}')" data-id="${c.id}">
      <div class="cc-header">
        <div class="cc-name">${indicatorStyle}${esc(c.name)}</div>
        <button class="vis-btn ${isVisible ? 'visible' : ''}"
          onclick="event.stopPropagation(); toggleRouteVisible('${c.id}', this)"
          title="${isVisible ? '地図から非表示' : '地図に表示'}"
          aria-label="${isVisible ? '地図から非表示' : '地図に表示'}">
          <i class="ti ${isVisible ? 'ti-map-pin' : 'ti-map-pin-off'}" aria-hidden="true"></i>
        </button>
      </div>
      <div class="cc-meta">
        <span>📍 ${parseFloat(c.distance_km||0).toFixed(1)} km</span>
        <span>⛰ ${Math.round(c.elevation_m||0)} m</span>
        <span>⏱ ${fmtDur(parseInt(c.duration_sec||0))}</span>
      </div>
      <div class="cc-tags">
        <span class="area-tag ${areaKey}">${esc(c.area||'—')}</span>
        ${srcDot}
      </div>
      <div class="color-picker-row">
        <span class="color-label">色:</span>
        ${colorDots}
      </div>
    </div>`;
  }).join('');
}

// ── コース選択・ルート表示 ────────────────────────────────
async function selectCourse(id) {
  activeId = id;

  // まだ表示されていなければ自動的に表示ON
  if (!visibleCourses.has(id)) {
    visibleCourses.add(id);
  }
  renderList();
  await showRoute(id, true);
}

// ── ルート表示トグル ─────────────────────────────────────
async function toggleRouteVisible(id, btn) {
  if (visibleCourses.has(id)) {
    // 非表示に
    visibleCourses.delete(id);
    if (routeLayers[id]) {
      map.removeLayer(routeLayers[id]);
      delete routeLayers[id];
    }
    if (activeId === id) {
      closeDetail();
      activeId = null;
    }
  } else {
    // 表示に
    visibleCourses.add(id);
    btn.classList.add('loading');
    await showRoute(id, false);
    btn.classList.remove('loading');
    // 表示中の全ルートにfitBounds
    const allLayers = Object.values(routeLayers);
    if (allLayers.length > 0) {
      map.fitBounds(L.featureGroup(allLayers).getBounds(), { padding: [40, 40] });
    }
  }
  renderList();
}

// ── ルート表示（GPX取得→描画）────────────────────────────
async function showRoute(id, fitBounds) {
  const course = allCourses.find(c => c.id == id);
  if (!course) return;
  const color = course.route_color || AREA_COLORS[course.area] || '#1D9E75';

  // キャッシュ済み
  if (gpxCache[id]) {
    drawRoute(id, gpxCache[id], color, fitBounds);
    showDetailPanel(course, gpxCache[id]);
    return;
  }

  document.getElementById('mapLoading').classList.add('show');

  try {
    const url  = `${GAS_URL}?key=${encodeURIComponent(ACCESS_KEY)}&action=gpx&id=${id}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);

    const pts = parseGpxContent(data.content);
    gpxCache[id] = pts;
    drawRoute(id, pts, color, fitBounds);
    showDetailPanel(course, pts);
  } catch(e) {
    console.error('GPX取得エラー:', e);
  } finally {
    document.getElementById('mapLoading').classList.remove('show');
  }
}

// ── GPX文字列からLatLng配列を取得 ────────────────────────
function parseGpxContent(content) {
  const parser = new DOMParser();
  const doc    = parser.parseFromString(content, 'text/xml');
  const ns     = 'http://www.topografix.com/GPX/1/1';
  const pts    = [];

  // GPX名前空間あり
  let trkpts = Array.from(doc.getElementsByTagNameNS(ns, 'trkpt'));
  // なければ名前空間なし
  if (trkpts.length === 0) trkpts = Array.from(doc.getElementsByTagName('trkpt'));

  trkpts.forEach(pt => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    let ele = null;
    const eleEl = pt.getElementsByTagNameNS(ns,'ele')[0] || pt.getElementsByTagName('ele')[0];
    if (eleEl) ele = parseFloat(eleEl.textContent);
    if (!isNaN(lat) && !isNaN(lon)) pts.push([lat, lon, ele]);
  });
  return pts;
}

// ── ルートを地図に描画 ────────────────────────────────────
function drawRoute(id, pts, color, fitBounds) {
  if (routeLayers[id]) map.removeLayer(routeLayers[id]);

  const latlngs = pts.map(p => [p[0], p[1]]);
  const line = L.polyline(latlngs, {
    color,
    weight   : activeId == id ? 4 : 2.5,
    opacity  : activeId == id ? 0.9 : 0.5,
  }).addTo(map);

  // スタートマーカー
  if (latlngs.length > 0) {
    L.circleMarker(latlngs[0], {
      radius: 6, fillColor: color, color: '#fff',
      weight: 2, fillOpacity: 1,
    }).addTo(map).bindTooltip('スタート', { permanent: false });
  }

  routeLayers[id] = line;
  if (fitBounds && latlngs.length > 0) map.fitBounds(line.getBounds(), { padding: [40, 40] });
}

// ── 高低図パネル表示（右下固定）────────────────────────
function showDetailPanel(course, pts) {
  const color   = course.route_color || AREA_COLORS[course.area] || '#1D9E75';
  const hasHr   = course.avg_hr      && parseInt(course.avg_hr)      > 0;
  const hasCad  = course.avg_cadence && parseInt(course.avg_cadence) > 0;
  const isBryton = (course.data_source||'').includes('bryton');

  // タイトル
  document.getElementById('epTitle').textContent = course.name || '—';

  // 統計グリッド（4列固定 + Brytonデータは色付き）
  const stats = [
    { n: parseFloat(course.distance_km||0).toFixed(1) + ' km', l: '距離' },
    { n: Math.round(course.elevation_m||0) + ' m',              l: '獲得標高' },
    { n: fmtDur(parseInt(course.duration_sec||0)),               l: '走行時間' },
    { n: parseFloat(course.avg_speed_kmh||0).toFixed(1) + ' km/h', l: 'Avg速度' },
  ];
  if (hasHr)  stats.push({ n: course.avg_hr       + ' bpm', l: '平均心拍',  br: true });
  if (hasCad) stats.push({ n: course.avg_cadence  + ' rpm', l: 'Avgケイデ', br: true });
  if (course.max_speed_kmh && parseFloat(course.max_speed_kmh) > 0)
    stats.push({ n: parseFloat(course.max_speed_kmh).toFixed(1) + ' km/h', l: 'MAX速度' });

  document.getElementById('epStats').innerHTML = stats.map(s =>
    `<div class="elev-stat ${s.br ? 'br' : ''}">
      <div class="elev-stat-n">${s.n}</div>
      <div class="elev-stat-l">${s.l}</div>
    </div>`
  ).join('');

  // 標高プロファイル（SVG）
  const eles = pts.map(p => p[2]).filter(e => e !== null && !isNaN(e));
  if (eles.length > 1) {
    const eMin   = Math.min(...eles);
    const eMax   = Math.max(...eles);
    const eRange = eMax - eMin || 1;
    const step   = Math.max(1, Math.floor(eles.length / 200));
    const sampled = eles.filter((_, i) => i % step === 0);
    const W = 312, H = 80, PY = 6, PX = 0;
    const points = sampled.map((e, i) => {
      const x = PX + (i / (sampled.length - 1)) * (W - PX * 2);
      const y = H - PY - ((e - eMin) / eRange) * (H - PY * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    const poly = points.join(' ');
    const fill = '0,' + H + ' ' + poly + ' ' + W + ',' + H;

    // グリッドライン（横3本）
    const gridLines = [0.25, 0.5, 0.75].map(r => {
      const y = (H - PY) - r * (H - PY * 2);
      return `<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>`;
    }).join('');

    document.getElementById('epChart').innerHTML = `
      <defs>
        <linearGradient id="epGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0.04"/>
        </linearGradient>
      </defs>
      <rect width="${W}" height="${H}" fill="#f8fafb" rx="0"/>
      ${gridLines}
      <polygon points="${fill}" fill="url(#epGrad)"/>
      <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
    `;
    document.getElementById('epEleMin').textContent = Math.round(eMin) + 'm';
    document.getElementById('epEleMax').textContent = Math.round(eMax) + 'm';
  }

  // フッター
  document.getElementById('epDate').textContent = course.date || '—';
  const srcEl = document.getElementById('epSrc');
  if (isBryton) {
    srcEl.textContent   = 'Bryton';
    srcEl.className     = 'elev-footer-src src-br-badge';
  } else {
    srcEl.textContent   = 'Runkeeper';
    srcEl.className     = 'elev-footer-src src-rk-badge';
  }

  document.getElementById('elevPanel').classList.add('show');
}

function closeDetail() {
  document.getElementById('elevPanel').classList.remove('show');
}

// ── 全コース表示トグル ────────────────────────────────────
async function toggleAllRoutes() {
  const courses   = getFilteredCourses();
  const allShown  = courses.every(c => visibleCourses.has(c.id));
  const btn       = document.getElementById('btnAllRoutes');

  if (allShown) {
    // 全て非表示に
    courses.forEach(c => {
      visibleCourses.delete(c.id);
      if (routeLayers[c.id]) {
        map.removeLayer(routeLayers[c.id]);
        delete routeLayers[c.id];
      }
    });
    closeDetail();
    activeId = null;
    btn.classList.remove('on');
    btn.textContent = '🗺 全コース表示';
    renderList();
    return;
  }

  // 全て表示に
  btn.classList.add('on');
  btn.textContent = '🗺 全コース非表示';
  document.getElementById('mapLoading').classList.add('show');

  for (const c of courses) {
    visibleCourses.add(c.id);
    if (!gpxCache[c.id]) {
      try {
        const url  = GAS_URL + '?key=' + encodeURIComponent(ACCESS_KEY) + '&action=gpx&id=' + c.id;
        const res  = await fetch(url);
        const data = await res.json();
        if (data.status === 'ok') gpxCache[c.id] = parseGpxContent(data.content);
      } catch(e) { /* skip */ }
    }
    if (gpxCache[c.id] && !routeLayers[c.id]) {
      const color = c.route_color || AREA_COLORS[c.area] || '#888';
      drawRoute(c.id, gpxCache[c.id], color, false);
    }
  }

  document.getElementById('mapLoading').classList.remove('show');
  renderList();

  const allLayers = Object.values(routeLayers);
  if (allLayers.length > 0) {
    map.fitBounds(L.featureGroup(allLayers).getBounds(), { padding: [30, 30] });
  }
}

// ── フィルター設定 ────────────────────────────────────────
function setupFilters() {
  // エリア
  document.getElementById('areaFilter').addEventListener('click', e => {
    const tag = e.target.closest('.tag');
    if (!tag) return;
    document.querySelectorAll('#areaFilter .tag').forEach(t => t.classList.remove('on'));
    tag.classList.add('on');
    courseFilter.area = tag.dataset.val;
    renderList();
    // フィルター変更時は表示中ルートをそのまま維持
  });

  // 距離帯
  document.getElementById('distFilter').addEventListener('click', e => {
    const tag = e.target.closest('.tag');
    if (!tag) return;
    document.querySelectorAll('#distFilter .tag').forEach(t => t.classList.remove('on'));
    tag.classList.add('on');
    courseFilter.dist_min = tag.dataset.min || '';
    courseFilter.dist_max = tag.dataset.max || '';
    renderList();
  });

  // タイプ
  document.getElementById('typeFilter').addEventListener('click', e => {
    const tag = e.target.closest('.tag');
    if (!tag) return;
    document.querySelectorAll('#typeFilter .tag').forEach(t => t.classList.remove('on'));
    tag.classList.add('on');
    courseFilter.type = tag.dataset.val;
    renderList();
  });
}

// ── ユーティリティ ────────────────────────────────────────
function fmtDur(sec) {
  if (!sec) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return `${h}:${String(m).padStart(2,'0')}`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getAreaKey(area) {
  if (!area) return '';
  if (['仙台市内','秋保・定義','作並','七ツ森','泉・富谷'].includes(area)) return 'sendai';
  if (area === '高知')   return 'kochi';
  if (area === 'しまなみ') return 'shimana';
  if (area === '輪行先') return 'rinko';
  return '';
}

// ── 起動 ──────────────────────────────────────────────────
initMap();
setupFilters();
loadCourses();
</script>
